<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MIND71 - Advanced AI Intelligence Platform for Saudi Innovation and Vision 2030.">
    <title>MIND71 Intelligence Platform | YallaStarter</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/mind71-chat_v2.css">
</head>

<body>
    <header class="header" role="banner">
        <nav class="navbar" role="navigation" aria-label="Main">
            <a href="index.html" class="logo">
                <span class="logo-text">YallaStarter</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="mind71.html" class="active">MIND71 AI</a></li>
            </ul>

            <div class="language-switcher">
                <button class="language-btn active" onclick="switchLanguage('en')">English</button>
                <button class="language-btn" onclick="switchLanguage('ar')">العربية</button>
            </div>

            <div class="auth-buttons">
                <a href="create-project.html" class="btn btn-primary">Start a Project</a>
                <a href="login.html" class="btn btn-link">Log In</a>
            </div>

            <button type="button" class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false"
                aria-controls="mobile-menu">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
        </nav>

        <div id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation" aria-hidden="true">
            <div class="mobile-menu-header">
                <div class="mobile-header-left">
                    <div class="language-switcher">
                        <button class="language-btn active" onclick="switchLanguage('en')">English</button>
                        <button class="language-btn" onclick="switchLanguage('ar')">العربية</button>
                    </div>
                    <div class="auth-buttons">
                        <a href="create-project.html" class="btn btn-primary">Start a Project</a>
                        <a href="login.html" class="btn btn-link">Log In</a>
                    </div>
                </div>
                <button class="mobile-close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="mind71.html" class="active">MIND71 AI</a></li>
            </ul>
        </div>
    </header>

    <!-- Neural Background Layer -->
    <div class="neural-bg">
        <div class="neural-particles"></div>
    </div>

    <div class="app-shell">
        <!-- Enterprise Sidebar -->
        <aside class="app-sidebar">
            <div class="sidebar-brand">
                <div class="brand-orb"></div>
                <span class="brand-name">MIND71</span>
            </div>

            <div class="new-chat-btn-wrapper">
                <button class="btn-premium">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>New Strategy</span>
                </button>
            </div>

            <nav class="nav-history">
                <!-- Session list injected here -->
            </nav>

            <div style="padding: 1.5rem; border-top: 1px solid var(--glass-border); opacity: 0.6; font-size: 0.75rem;">
                <div style="margin-bottom: 0.5rem;"><i class="fa-solid fa-shield-halved"></i> SECURE LINK</div>
                <div>v2.0.25 // SAUDI_VISION_READY</div>
            </div>
        </aside>

        <!-- Intelligence Hub -->
        <main class="chat-window">
            <!-- Top HUD -->
            <header class="top-nav">
                <div class="platform-status">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        CORE_ACTIVE
                    </div>
                </div>

                <div style="display: flex; gap: 0.75rem;">
                    <button class="hud-icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button class="hud-icon-btn"><i class="fa-solid fa-gear"></i></button>
                    <div
                        style="width: 32px; height: 32px; border-radius: 50%; background: var(--navy-surface); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800;">
                        AD</div>
                </div>
            </header>

            <!-- Intelligence Flow -->
            <div class="chat-scroll" id="chat-flow">
                <!-- Messages injected here -->
            </div>

            <!-- Command HUD -->
            <div class="chat-input-hud">
                <div class="thinking-feedback">
                    <div class="brand-orb" style="width: 10px; height: 10px;"></div>
                    <span>Mind71 is synthesizing strategy...</span>
                    <button id="stop-generating" class="hud-stop-btn" style="display: none; margin-left: 1rem;">
                        <i class="fa-solid fa-square"></i> Stop Generating
                    </button>
                </div>

                <div class="hud-glass-card">
                    <div class="hud-actions">
                        <button class="hud-icon-btn"><i class="fa-solid fa-layer-group"></i></button>
                    </div>

                    <textarea id="main-input"
                        placeholder="Consult Intelligence Hub... (e.g. Analysis of GEA funding trends)"
                        rows="1"></textarea>

                    <div class="hud-actions">
                        <button class="hud-icon-btn"><i class="fa-solid fa-microphone"></i></button>
                        <button class="hud-icon-btn btn-send-glow"><i class="fa-solid fa-arrow-up"></i></button>
                    </div>
                </div>

                <div
                    style="margin-top: 1rem; text-align: center; opacity: 0.4; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;">
                    Institutional grade AI platform for National Economic Innovation
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="mobile-menu.js"></script>
    <script src="assets/js/session-init.js"></script>
    <script>
        function switchLanguage(lang) {
            if (lang === 'en') {
                window.location.href = 'mind71.html';
            } else if (lang === 'ar') {
                window.location.href = 'mind71-ar.html';
            }
        }
    </script>
    <script type="module" src="assets/js/mind71-chat_v2.js"></script>
</body>

</html>
