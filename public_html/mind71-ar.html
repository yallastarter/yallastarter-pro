<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MIND71 - منصة متقدمة للذكاء الاصطناعي لدعم الابتكار السعودي ورؤية 2030.">
    <title>منصة MIND71 الاستراتيجية | يلا ستارتر</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/mind71-chat_v2.css">
    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }

        .message-row.user-msg {
            align-items: flex-start;
        }

        /* Adjust RTL user msg */
        .message-row.ai-msg {
            align-items: flex-end;
        }
    </style>
</head>

<body>
    <!-- Neural Background Layer -->
    <div class="neural-bg">
        <div class="neural-particles"></div>
    </div>

    <div class="app-shell">
        <!-- Enterprise Sidebar -->
        <aside class="app-sidebar">
            <div class="sidebar-brand">
                <div class="brand-orb"></div>
                <span class="brand-name">MIND71</span>
            </div>

            <div class="new-chat-btn-wrapper">
                <button class="btn-premium">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>استراتيجية جديدة</span>
                </button>
            </div>

            <nav class="nav-history">
                <!-- Session list injected here -->
            </nav>

            <div style="padding: 1.5rem; border-top: 1px solid var(--glass-border); opacity: 0.6; font-size: 0.75rem;">
                <div style="margin-bottom: 0.5rem;"><i class="fa-solid fa-shield-halved"></i> رابط آمن</div>
                <div>v2.0.25 // SAUDI_VISION_READY</div>
            </div>
        </aside>

        <!-- Intelligence Hub -->
        <main class="chat-window">
            <!-- Top HUD -->
            <header class="top-nav">
                <div class="platform-status">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        CORE_ACTIVE
                    </div>
                    <div style="color: var(--text-dim); font-size: 0.8rem; font-weight: 500;">
                        مركز: <span id="model-badge" style="color: var(--accent-blue);">DEEPSEEK_R1_X_1.5B</span>
                    </div>
                </div>

                <div style="display: flex; gap: 0.75rem;">
                    <button class="hud-icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button class="hud-icon-btn"><i class="fa-solid fa-gear"></i></button>
                    <div
                        style="width: 32px; height: 32px; border-radius: 50%; background: var(--navy-surface); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800;">
                        AD</div>
                </div>
            </header>

            <!-- Intelligence Flow -->
            <div class="chat-scroll" id="chat-flow">
                <!-- Messages injected here -->
            </div>

            <!-- Command HUD -->
            <div class="chat-input-hud">
                <div class="thinking-feedback">
                    <div class="brand-orb" style="width: 10px; height: 10px;"></div>
                    <span>Mind71 يقوم بتحليل الاستراتيجية...</span>
                </div>

                <div class="hud-glass-card">
                    <div class="hud-actions">
                        <button class="hud-icon-btn"><i class="fa-solid fa-layer-group"></i></button>
                    </div>

                    <textarea id="main-input" placeholder="استشر مركز الذكاء... (مثال: تحليل اتجاهات تمويل GEA)"
                        rows="1"></textarea>

                    <div class="hud-actions">
                        <button class="hud-icon-btn"><i class="fa-solid fa-microphone"></i></button>
                        <button class="hud-icon-btn btn-send-glow"><i class="fa-solid fa-arrow-up"></i></button>
                    </div>
                </div>

                <div
                    style="margin-top: 1rem; text-align: center; opacity: 0.4; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;">
                    منصة ذكاء اصطناعي سيادية لابتكار الاقتصاد الوطني
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script type="module" src="assets/js/mind71-chat_v2.js"></script>
</body>

</html>
